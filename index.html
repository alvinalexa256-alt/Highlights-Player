<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sports 803 · Match Card Creator · Full Leagues + Delete Events</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#07070a;--surface:#0e0e13;--surface2:#141419;--surface3:#1b1b22;
  --border:#1e1e28;--border2:#262632;
  --txt:#efefef;--txt2:#7a7a8f;--txt3:#3e3e50;
  --red:#e53935;--red-dim:rgba(229,57,53,.13);--red-border:rgba(229,57,53,.28);
  --green:#43a047;--green-dim:rgba(67,160,71,.11);--green-border:rgba(67,160,71,.28);
  --orange:#ff9800;--orange-dim:rgba(255,152,0,.10);--orange-border:rgba(255,152,0,.28);
  --blue:#2196f3;--blue-dim:rgba(33,150,243,.09);--blue-border:rgba(33,150,243,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}

/* SIDEBAR */
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:14px 12px;display:flex;flex-direction:column;gap:10px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.logo-badge{background:var(--red);color:#fff;font-weight:900;font-size:15px;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-title{font-size:15px;font-weight:800;letter-spacing:2px}
.logo-sub{font-size:9px;color:var(--txt3);letter-spacing:2px;text-transform:uppercase;margin-top:1px}
.sec-label{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--txt3);text-transform:uppercase;margin-bottom:5px}
.divider{height:1px;background:var(--border);flex-shrink:0}
.badge-row{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:7px;font-size:11px}
.badge-row.blue{background:var(--blue-dim);border:1px solid var(--blue-border);color:#64b5f6}
.badge-row.green{background:var(--green-dim);border:1px solid var(--green-border);color:#81c784}
.badge-row.orange{background:var(--orange-dim);border:1px solid var(--orange-border);color:#ffb74d}
.badge-row.red{background:var(--red-dim);border:1px solid var(--red-border);color:#ef9a9a}
.bdot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.bdot.pulse{animation:bpulse 1.2s infinite}
@keyframes bpulse{0%,100%{opacity:1}50%{opacity:.15}}
.date-tabs{display:flex;gap:4px}
.date-tab{flex:1;padding:6px 4px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;font-size:11px;font-weight:700;color:var(--txt2);cursor:pointer;text-align:center;transition:all .12s}
.date-tab.active{background:var(--red-dim);border-color:var(--red);color:var(--red)}
.date-tab:hover:not(.active){border-color:var(--red);color:var(--txt)}
.sport-tabs{display:flex;gap:3px;flex-wrap:wrap}
.sport-tab{padding:4px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;font-size:11px;font-weight:700;color:var(--txt2);cursor:pointer;transition:all .12s}
.sport-tab.active,.sport-tab:hover{background:var(--red-dim);border-color:var(--red);color:var(--red)}
input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;color:var(--txt);font-family:inherit;font-size:12px;padding:7px 10px;outline:none;transition:border-color .12s}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.4)}
.cfg-row{display:flex;flex-direction:column;gap:4px}
.cfg-hint{font-size:10px;color:var(--txt3);line-height:1.4}
.btn{width:100%;padding:9px;border-radius:8px;font-weight:700;font-size:13px;letter-spacing:.5px;cursor:pointer;border:none;transition:all .12s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover{background:#c62828}
.btn-secondary{background:var(--surface2);border:1px solid var(--border2);color:var(--txt2)}
.btn-secondary:hover{border-color:var(--red);color:var(--txt)}
.btn-firebase{background:linear-gradient(135deg,#f57c00,#e65100);color:#fff}
.btn-firebase:hover{filter:brightness(1.1)}
.btn-firebase:disabled{opacity:.45;cursor:not-allowed}
.btn-del{background:rgba(229,57,53,.2);border:1px solid var(--red-border);color:#ff8a80}
.btn-del:hover{background:var(--red);border-color:var(--red);color:#fff}
.status-bar{background:var(--surface2);border:1px solid var(--border2);border-radius:7px;padding:7px 10px;font-size:11px;color:var(--txt2);min-height:30px;display:flex;align-items:center;gap:6px;line-height:1.4}
.status-bar.ok{color:var(--green);border-color:var(--green-border)}
.status-bar.err{color:var(--red);border-color:var(--red-border)}
.status-bar.loading{color:#ffb300;border-color:rgba(255,179,0,.3)}
.sdot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}

/* MAIN */
.main{padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0;overflow:hidden}
.main-hdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.main-hdr h2{font-size:20px;font-weight:800;letter-spacing:2px}
.hdr-actions{display:flex;gap:6px;align-items:center}
.count-pill{background:var(--red-dim);border:1px solid var(--red-border);color:var(--red);font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:6px;border:1px solid var(--border2);background:var(--surface2);color:var(--txt2);cursor:pointer;font-weight:700;letter-spacing:.5px;transition:all .12s}
.btn-sm:hover{border-color:var(--red);color:var(--txt)}

/* EVENTS */
.events-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.events-empty{padding:40px;text-align:center;color:var(--txt3);font-size:13px}
.events-empty .ico{display:block;font-size:28px;margin-bottom:8px}
.events-empty small{display:block;font-size:11px;margin-top:5px}
.spinner-wrap{padding:40px;text-align:center;color:var(--txt3)}
.spinner{width:28px;height:28px;border:3px solid var(--border2);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.league-hdr{padding:5px 12px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.league-hdr-name{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--txt2)}
.league-hdr-count{font-size:10px;background:var(--red-dim);color:var(--red);border:1px solid var(--red-border);padding:1px 6px;border-radius:10px;font-weight:700;margin-left:auto}
.event-item{display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.event-item:last-child{border-bottom:none}
.event-item:hover{background:var(--surface2)}
.event-item.selected{background:rgba(229,57,53,.04);border-left:3px solid var(--red)}
.ev-chk{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--border2);background:var(--surface2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .1s}
.event-item.selected .ev-chk{background:var(--red);border-color:var(--red)}
.ev-chk svg{width:8px;height:8px;display:none}
.event-item.selected .ev-chk svg{display:block}
.ev-logos{display:flex;align-items:center;gap:3px;flex-shrink:0}
.ev-logo{width:26px;height:26px;border-radius:50%;background:var(--surface3);object-fit:contain;padding:2px}
.ev-vs{font-size:8px;color:var(--txt3);font-weight:700}
.ev-info{flex:1;min-width:0}
.ev-teams{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-meta{font-size:10px;color:var(--txt2);display:flex;gap:5px;margin-top:2px;flex-wrap:wrap;align-items:center}
.ev-league-tag{color:var(--red);font-weight:600}
.ev-time-col{text-align:right;flex-shrink:0}
.ev-hour{font-size:12px;font-weight:700}
.ev-status{font-size:9px;padding:2px 5px;border-radius:10px;font-weight:700;display:inline-block;margin-top:2px}
.ev-status.live{background:var(--red);color:#fff;animation:bpulse 1.4s infinite}
.ev-status.ended{background:var(--surface3);color:var(--txt3);border:1px solid var(--border2)}
.ev-status.upcoming{background:var(--green-dim);color:var(--green);border:1px solid var(--green-border)}

/* STREAM EDITOR */
.stream-editor{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stream-hdr{display:flex;align-items:center;justify-content:space-between}
.stream-hdr h3{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--txt2);text-transform:uppercase}
.stream-row{padding:10px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;margin-bottom:8px;display:flex;flex-direction:column;gap:8px}
.stream-row:last-child{margin-bottom:0}
.stream-lbl{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.ch-chip{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--surface3);border:1px solid var(--border2);color:var(--txt2);cursor:pointer;transition:all .12s;white-space:nowrap}
.ch-chip:hover{border-color:var(--green-border);color:#81c784}
.ch-chip.selected{background:var(--green-dim);border-color:var(--green-border);color:#81c784}
.ch-hint{font-size:10px;color:var(--txt3)}
.row-actions{display:flex;gap:6px;margin-top:5px}
.row-actions button{padding:5px 8px;font-size:10px;border-radius:5px;background:var(--surface3);border:1px solid var(--border2);color:var(--txt2);cursor:pointer}
.row-actions button.del-db:hover{background:var(--red-dim);border-color:var(--red);color:#ff8a80}

/* FIREBASE PUSH + DELETE */
.fb-push-panel{background:var(--surface);border:1px solid rgba(245,124,0,.3);border-radius:10px;overflow:hidden}
.fb-push-hdr{background:rgba(245,124,0,.08);border-bottom:1px solid rgba(245,124,0,.2);padding:10px 14px;display:flex;align-items:center;gap:8px}
.fb-push-hdr h3{font-size:11px;font-weight:700;letter-spacing:1px;color:#ffb74d;text-transform:uppercase;flex:1}
.fb-push-body{padding:14px;display:flex;flex-direction:column;gap:10px}
.fb-push-info{font-size:11px;color:var(--txt2);line-height:1.7;padding:8px 10px;background:var(--surface2);border-radius:7px;border:1px solid var(--border2)}
.fb-push-info strong{color:var(--txt)}
.fb-push-info code{font-size:10px;color:#ffd700;background:var(--surface3);padding:1px 5px;border-radius:3px}
.fb-push-stats{display:flex;gap:8px;flex-wrap:wrap}
.fb-push-stat{background:var(--surface2);border:1px solid var(--border2);border-radius:7px;padding:8px 10px;flex:1;min-width:70px;text-align:center}
.fb-push-stat-val{font-size:22px;font-weight:900;color:var(--red)}
.fb-push-stat-lbl{font-size:9px;color:var(--txt3);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.fb-mode-row{display:flex;gap:6px}
.fb-mode-btn{flex:1;padding:7px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border2);background:var(--surface2);color:var(--txt2);transition:all .12s;text-align:center}
.fb-mode-btn:hover,.fb-mode-btn.active{background:var(--orange-dim);border-color:var(--orange-border);color:#ffb74d}
.fb-save-status{border-radius:7px;padding:8px 10px;font-size:11px;display:none;align-items:center;gap:6px}
.fb-save-status.show{display:flex}
.fb-save-status.saving{background:var(--orange-dim);border:1px solid var(--orange-border);color:#ffb74d}
.fb-save-status.done{background:var(--green-dim);border:1px solid var(--green-border);color:#81c784}
.fb-save-status.fail{background:var(--red-dim);border:1px solid var(--red-border);color:#ef9a9a}
.fb-remote-list{background:var(--surface2);border-radius:8px;border:1px solid var(--border);margin-top:5px;max-height:200px;overflow-y:auto}
.fb-remote-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--border);font-size:11px}
.fb-remote-item:last-child{border-bottom:none}
.fb-remote-item button{margin-left:auto;background:transparent;border:1px solid var(--red-border);color:#ff8a80;border-radius:5px;padding:2px 8px;cursor:pointer}
.fb-remote-item button:hover{background:var(--red-dim)}

/* OUTPUT */
.output-area{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.out-tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto}
.out-tab{padding:9px 14px;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--txt2);cursor:pointer;border-bottom:2px solid transparent;transition:all .11s;white-space:nowrap}
.out-tab.active{color:var(--red);border-bottom-color:var(--red)}
.out-tab:hover:not(.active){color:var(--txt)}
.out-panel{display:none;padding:14px}
.out-panel.active{display:block}
.preview-bg{background:#e8eaed;border-radius:8px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.code-blk{background:#060608;border:1px solid var(--border);border-radius:7px;padding:12px;font-family:'Courier New',monospace;font-size:11px;line-height:1.7;color:#9bcc9b;overflow:auto;max-height:500px;white-space:pre}
.copy-bar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.copy-btn{padding:7px 12px;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;color:var(--txt2);font-size:11px;font-weight:700;cursor:pointer;transition:all .1s;display:flex;align-items:center;gap:5px}
.copy-btn:hover{border-color:var(--red);color:var(--txt)}
.copy-btn.copied{background:var(--green-dim);border-color:var(--green-border);color:var(--green)}
.containerMatch{font-family:Arial,Tahoma,sans-serif;width:100%;max-width:480px}
.containerMatch a{text-decoration:none;color:inherit;display:block}
.Match{background:#fff;border-radius:12px;padding:14px 14px 10px;box-shadow:0 2px 14px rgba(0,0,0,.1)}
.match-teams-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fareq{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;max-width:120px}
.Imagee img{width:70px;height:70px;object-fit:contain;border-radius:6px;background:#f5f5f5;padding:3px}
.asm{font-size:12px;font-weight:700;text-align:center;color:#111;line-height:1.3}
.Nateja{display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 6px;flex-shrink:0}
.matchHour{font-size:11px;color:#888;font-weight:600}
.natej{font-size:24px;font-weight:900;color:#111;letter-spacing:3px}
.matchDate{font-size:10px;color:#aaa}
.Show{height:8px}
.containerMatch ul{background:#f8f9fa;border-radius:8px;padding:7px 14px;margin:0;list-style:none}
.containerMatch ul li{font-size:12px;color:#555;padding:3px 0;border-bottom:1px solid #eee}
.containerMatch ul li:last-child{border-bottom:none}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto}}
</style>
</head>

    if(!firebase.apps.length)firebase.initializeApp({databaseURL:url});
    rtdb=firebase.database();
    rtdb.ref('livetv/channels').on('value',snap=>{if(snap.exists()){const d=snap.val();allChannels=Object.keys(d).map(k=>Object.assign({_key:k},d[k]));}else allChannels=[]; fbReady=true; document.getElementById('fbBadge').className='badge-row green';document.getElementById('fbStatus').textContent='Firebase ready';document.getElementById('chBadge').style.display='flex';document.getElementById('chText').textContent=allChannels.length+' channels';if(allMatches.length)updateStreamEditor();},err=>setFbBadge('red','FB err'));
  }catch(e){setFbBadge('red',e.message);}}
function setFbBadge(col,msg){document.getElementById('fbBadge').className='badge-row '+col;document.getElementById('fbStatus').textContent=msg;}
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();}
function fuzzy(a,b){const an=norm(a),bn=norm(b);if(an===bn)return 100;if(an.includes(bn)||bn.includes(an))return 85;const at=an.split(' '),bt=bn.split(' ');const common=at.filter(t=>bt.includes(t));return Math.round((common.length*2/(at.length+bt.length))*65);}
function bestMatch(names){if(!allChannels.length||!names?.length)return null;let best=null,bestScore=0;names.forEach(n=>{allChannels.forEach(ch=>{const s=fuzzy(n,ch.name||'');if(s>bestScore){bestScore=s;best={ch,score:s,matchedAs:n};}});});return bestScore>=30?best:null;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function getDateStr(off=0){const d=new Date();d.setDate(d.getDate()+off);return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
function fmtTime(iso){if(!iso)return'--:--';const d=new Date(iso);let h=d.getHours(),m=d.getMinutes(),ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+(m<10?'0'+m:m)+' '+ap;}
function fmtHHMM(iso){if(!iso)return'';const d=new Date(iso);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function fbAvatar(name){return'https://ui-avatars.com/api/?name='+encodeURIComponent(name)+'&size=64&background=1a1a1a&color=e53935&bold=true&rounded=true';}
const LIVE_S=new Set(['STATUS_IN_PROGRESS','STATUS_HALFTIME','STATUS_IN_PROGRESS_2','STATUS_OVERTIME']); const END_S=new Set(['STATUS_FINAL','STATUS_FULL_TIME','STATUS_FINAL_OT','STATUS_POSTPONED']);
function getStatus(m){if(LIVE_S.has(m.statusType))return'live';if(END_S.has(m.statusType))return'ended';return'upcoming';}
function getScore(m){if(m.isRacing)return'🏁';if(m.scoreHome===null||m.scoreAway===null)return'0-0';return m.scoreHome+'-'+m.scoreAway;}
async function fetchMatches(){
  const custom=document.getElementById('customDate').value; const dateStr=custom?custom.replace(/-/g,''):getDateStr(activeOffset); setStatus('Fetching...','loading');
  document.getElementById('eventsArea').innerHTML='<div class="spinner-wrap"><div class="spinner"></div></div>';
  let toFetch; if(activeSport==='football') toFetch=LEAGUES.filter(l=>l.sport==='football'); else if(activeSport==='all') toFetch=LEAGUES.filter(l=>['eng.1','esp.1','ita.1','ger.1','fra.1','uefa.champions','fifa.world','uefa.euro','nba','f1','motogp'].includes(l.id)); else toFetch=LEAGUES.filter(l=>l.sport===activeSport);
  const fetches=toFetch.map(league=>fetch(`https://site.api.espn.com/apis/site/v2/sports/${league.espnPath}/scoreboard?dates=${dateStr}&limit=40`).then(r=>r.json()).then(d=>({league,events:d.events||[]})).catch(()=>({league,events:[]})));
  const results=await Promise.all(fetches); allMatches=[]; selectedIds.clear(); channelOverrides={}; postLinks={};
  results.forEach(({league,events})=>{events.forEach(ev=>{let m=null; if(league.espnType==='racing'){const sType=ev.status?.type?.name||'STATUS_SCHEDULED';m={id:ev.id,date:ev.date,sport:'motorsport',isRacing:true,league:{name:league.name,emoji:league.emoji,id:league.id},homeName:ev.name||'Race',homeLogo:'',awayName:'',awayLogo:'',scoreHome:null,scoreAway:null,statusType:sType,elapsed:'',espnBroadcasts:[]};}else{const comp=ev.competitions?.[0];if(!comp)return;const home=comp.competitors?.find(c=>c.homeAway==='home'),away=comp.competitors?.find(c=>c.homeAway==='away');if(!home||!away)return;const bcast=[];(comp.broadcasts||[]).forEach(b=>{(b.names||[]).forEach(n=>{if(n)bcast.push(n);});});m={id:ev.id,date:ev.date,sport:league.sport,isRacing:false,league:{name:league.name,emoji:league.emoji,id:league.id},homeName:home.team?.displayName||'Home',homeLogo:home.team?.logo||'',awayName:away.team?.displayName||'Away',awayLogo:away.team?.logo||'',scoreHome:home.score!==''?parseInt(home.score):null,scoreAway:away.score!==''?parseInt(away.score):null,statusType:comp.status?.type?.name||'SCHEDULED',elapsed:comp.status?.displayClock||'',espnBroadcasts:bcast};} if(m)allMatches.push(m);});});
  allMatches.sort((a,b)=>new Date(a.date)-new Date(b.date)); if(!allMatches.length){document.getElementById('eventsArea').innerHTML='<div class="events-empty">No matches</div>';setStatus('No events','err');return;} setStatus(allMatches.length+' matches','ok'); renderEvents();
}
function renderEvents(){ const matches=activeSport==='all'?allMatches:allMatches.filter(m=>m.sport===activeSport); if(!matches.length){document.getElementById('eventsArea').innerHTML='<div class="events-empty">No matches</div>';return;} const groups={}; matches.forEach(m=>{if(!groups[m.league.id])groups[m.league.id]={league:m.league,matches:[]}; groups[m.league.id].matches.push(m);}); let html=''; Object.values(groups).forEach(g=>{html+='<div class="league-hdr"><span>'+g.league.emoji+'</span><span class="league-hdr-name">'+g.league.name.toUpperCase()+'</span><span class="league-hdr-count">'+g.matches.length+'</span></div>'; g.matches.forEach(m=>{const sel=selectedIds.has(m.id),st=getStatus(m); html+='<div class="event-item'+(sel?' selected':'')+'" data-id="'+m.id+'" onclick="toggleSelect(\''+m.id+'\')"><div class="ev-chk"><svg viewBox="0 0 10 8"><path d="M1 4l3 3 5-5" stroke="#fff" stroke-width="1.8"/></svg></div><div class="ev-logos"><img class="ev-logo" src="'+(m.homeLogo||fbAvatar(m.homeName))+'" onerror="this.src=\''+fbAvatar(m.homeName)+'\'"/>'+(m.isRacing?'':'<span class="ev-vs">VS</span><img class="ev-logo" src="'+(m.awayLogo||fbAvatar(m.awayName))+'" onerror="this.src=\''+fbAvatar(m.awayName)+'\'"/>')+'</div><div class="ev-info"><div class="ev-teams">'+esc(m.isRacing?m.homeName:m.homeName+' vs '+m.awayName)+'</div><div class="ev-meta"><span class="ev-league-tag">'+esc(g.league.name)+'</span></div></div><div class="ev-time-col"><div class="ev-hour">'+fmtTime(m.date)+'</div><div class="ev-status '+st+'">'+((st==='live')?'LIVE':(st==='ended'?'Ended':'Upcoming'))+'</div></div></div>';});}); document.getElementById('eventsArea').innerHTML=html; updateSelCount();}
function toggleSelect(id){selectedIds.has(id)?selectedIds.delete(id):selectedIds.add(id); const el=document.querySelector('[data-id="'+id+'"]'); if(el)el.classList.toggle('selected',selectedIds.has(id)); updateSelCount();updateStreamEditor();updateFbPushPanel();}
function toggleAll(){const items=document.querySelectorAll('.event-item');const allSel=[...items].every(el=>el.classList.contains('selected')); items.forEach(el=>{const id=el.dataset.id;if(allSel){selectedIds.delete(id);el.classList.remove('selected');}else{selectedIds.add(id);el.classList.add('selected');}});updateSelCount();updateStreamEditor();updateFbPushPanel();}
function updateSelCount(){document.getElementById('selCount').textContent=selectedIds.size+' selected';}
function getChannelForMatch(id){if(channelOverrides.hasOwnProperty(id)){if(channelOverrides[id]===null)return null;return allChannels.find(c=>c._key===channelOverrides[id])||null;}const m=allMatches.find(x=>x.id===id);return m?bestMatch(m.espnBroadcasts||[])?.ch||null:null;}
function updateStreamEditor(){ const ed=document.getElementById('streamEditor'); if(!selectedIds.size){ed.style.display='none';return;}ed.style.display='block';document.getElementById('streamCount').textContent=selectedIds.size+' matches'; let h=''; selectedIds.forEach(id=>{const m=allMatches.find(x=>x.id===id);if(!m)return; const autoMatch=bestMatch(m.espnBroadcasts||[]); const currentKey=channelOverrides.hasOwnProperty(id)?channelOverrides[id]:autoMatch?.ch?._key; let chips=''; const candidates=[]; if(autoMatch?.ch)candidates.push(autoMatch.ch); (m.espnBroadcasts||[]).forEach(bname=>{allChannels.forEach(ch=>{if(fuzzy(bname,ch.name||'')>=25&&!candidates.find(c=>c._key===ch._key))candidates.push(ch);});}); candidates.slice(0,10).forEach(ch=>{chips+='<div class="ch-chip'+(ch._key===currentKey?' selected':'')+'" onclick="selectChannel(\''+id+'\',\''+ch._key+'\')">'+esc(ch.name||ch._key)+'</div>';}); chips+='<div class="ch-chip'+(channelOverrides[id]===null?' selected':'')+'" onclick="selectChannel(\''+id+'\',null)">✕ None</div>'; h+='<div class="stream-row"><div class="stream-lbl">'+m.league.emoji+' '+esc(m.isRacing?m.homeName:m.homeName+' vs '+m.awayName)+'</div><input type="text" value="'+esc(postLinks[id]||'')+'" placeholder="Stream URL (optional)" oninput="postLinks[\''+id+'\']=this.value"/><div class="ch-chips">'+chips+'</div><div class="row-actions"><button class="del-db" onclick="deleteMatchFromFirebase(\''+id+'\')">🗑️ Delete from Firebase</button></div></div>';}); document.getElementById('streamInputs').innerHTML=h; }
function selectChannel(matchId,chKey){channelOverrides[matchId]=chKey;updateStreamEditor();updateFbPushPanel();}
function buildPostUrl(m){ const override=document.getElementById('overrideUrl').value.trim(); if(override)return override; if(postLinks[m.id])return postLinks[m.id]; const base=(document.getElementById('blogBase').value||'https://www.sports803.online').replace(/\/$/,''); const d=new Date(m.date); const yr=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,'0'); const slug=m.isRacing?slugify(m.homeName):slugify(m.homeName)+'-vs-'+slugify(m.awayName); return base+'/'+yr+'/'+mo+'/'+slug+'.html';}
function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
async function deleteMatchFromFirebase(matchId){ if(!rtdb){setStatus('Firebase not connected','err');return;} const path=(document.getElementById('fbMatchPath').value||'s803config/todaysMatches').trim(); const ref=rtdb.ref(path).child(`match_${matchId}`); try{await ref.remove(); setStatus(`✅ Deleted match ${matchId} from Firebase`,'ok'); showFbStatus('done','Event removed from database'); await loadRemoteEventsList(); }catch(err){setStatus(`Delete failed: ${err.message}`,'err');} }
async function loadRemoteEventsList(){ if(!rtdb)return; const path=(document.getElementById('fbMatchPath').value||'s803config/todaysMatches').trim(); const snap=await rtdb.ref(path).once('value'); const data=snap.val()||{}; let listHtml=''; Object.entries(data).forEach(([key,ev])=>{ const matchId=key.replace('match_',''); const name=ev.homeName+(ev.awayName?` vs ${ev.awayName}`:''); listHtml+=`<div class="fb-remote-item"><span><strong>${esc(name)}</strong> <span style="color:#aaa">${ev.leagueName||''}</span></span><button onclick="deleteMatchFromFirebase('${matchId}')">Delete</button></div>`; }); if(!listHtml)listHtml='<div class="fb-remote-item" style="color:#aaa">No events stored</div>'; document.getElementById('fbRemoteList').innerHTML=listHtml; }
function setPushMode(mode){pushMode=mode; document.getElementById('modeMerge').classList.toggle('active',mode==='merge');document.getElementById('modeReplace').classList.toggle('active',mode==='replace');}
function updateFbPushPanel(){ const panel=document.getElementById('fbPushPanel'); if(!selectedIds.size){panel.style.display='none';return;} panel.style.display='block'; document.getElementById('fbPushCount').textContent=selectedIds.size; loadRemoteEventsList();}
async function pushToFirebase(){ if(!rtdb){showFbStatus('fail','Firebase not connected');return;} const path=(document.getElementById('fbMatchPath').value||'s803config/todaysMatches').trim(); const btn=document.getElementById('fbPushBtn');btn.disabled=true; showFbStatus('saving','Pushing...'); try{ const newData={}; selectedIds.forEach(id=>{const m=allMatches.find(x=>x.id===id);if(!m)return; const ch=getChannelForMatch(id); newData[`match_${id}`]={id:m.id,kickoff:m.date||'',sport:m.sport,isRacing:m.isRacing||false,homeName:m.homeName,homeLogo:m.homeLogo||'',awayName:m.awayName,awayLogo:m.awayLogo||'',score:getScore(m),statusType:m.statusType||'',leagueName:m.league.name,leagueEmoji:m.league.emoji,postUrl:buildPostUrl(m),channelKey:ch?ch._key:'',channelName:ch?ch.name:'',matchTime:fmtHHMM(m.date),startISO:m.date||'',updatedAt:Date.now()};}); if(pushMode==='replace')await rtdb.ref(path).set(newData); else await rtdb.ref(path).update(newData); showFbStatus('done',`${selectedIds.size} matches pushed`); await loadRemoteEventsList(); }catch(err){showFbStatus('fail',err.message);} finally{btn.disabled=false;} }
function showFbStatus(type,msg){const el=document.getElementById('fbSaveStatus'); el.className=`fb-save-status show ${type}`; el.innerHTML=`<div class="sdot"></div><span>${msg}</span>`; if(type==='done')setTimeout(()=>el.classList.remove('show'),4000);}
function generateCards(){ if(!selectedIds.size){setStatus('Select matches','err');return;} let previewHtml='',cardBlocks=''; selectedIds.forEach(id=>{const m=allMatches.find(x=>x.id===id);if(!m)return; const ch=getChannelForMatch(id); const postUrl=buildPostUrl(m); const hLogo=m.homeLogo||BLANK; const aLogo=m.awayLogo||BLANK; const card=`<div class="containerMatch"><a href="${esc(postUrl)}"><div class="Match"><div class="match-teams-row"><div class="fareq"><div class="Imagee"><img alt="${esc(m.homeName)}" height="70" src="${esc(hLogo)}" width="70"/></div><div class="asm">${esc(m.homeName)}</div></div><div class="Nateja"><div class="matchHour">${esc(fmtHHMM(m.date))}</div><div class="natej">${esc(getScore(m))}</div><div class="matchDate"></div></div><div class="fareq"><div class="Imagee"><img alt="${esc(m.awayName)}" height="70" src="${esc(aLogo)}" width="70"/></div><div class="asm">${esc(m.awayName)}</div></div></div><div class="Show"></div><ul><li>${esc(ch?.name||'غير معروف')}</li><li>${esc(m.league.name)}</li></ul></div></a></div>`; cardBlocks+=card+'\n'; previewHtml+=card; }); document.getElementById('outputArea').style.display='block'; document.getElementById('cardPreview').innerHTML=previewHtml; document.getElementById('cardHtmlOut').textContent=cardBlocks; document.getElementById('widgetSnippet').textContent=buildWidgetCode(); setStatus('Cards generated','ok');}
function buildWidgetCode(){ const dbUrl=(document.getElementById('fbUrl').value||'').trim(), path=(document.getElementById('fbMatchPath').value||'s803config/todaysMatches').trim(); return `<!-- widget snippet -->\n<div id="s803MatchWidget"></div>\n<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"><\/script>\n<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"><\/script>\n<script>(function(){var DB='${dbUrl}',PATH='${path}';var app;try{app=firebase.app();}catch(e){app=firebase.initializeApp({databaseURL:DB});}var db=firebase.database(app);function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}function render(arr){var html='';arr.forEach(function(m){html+='<div class="containerMatch"><a href="'+esc(m.postUrl||'#')+'"><div class="Match"><div class="fareq"><div class="Imagee"><img alt="'+esc(m.homeName)+'" height="70" src="'+(m.homeLogo||'')+'" width="70"/></div><div class="asm">'+esc(m.homeName)+'</div></div><div class="Nateja"><div class="matchHour">'+esc(m.matchTime)+'</div><div class="natej">'+esc(m.score)+'</div></div><div class="fareq"><div class="Imagee"><img alt="'+esc(m.awayName)+'" height="70" src="'+(m.awayLogo||'')+'" width="70"/></div><div class="asm">'+esc(m.awayName)+'</div></div></div><ul><li>'+esc(m.channelName||'')+'</li><li>'+esc(m.leagueName)+'</li></ul></a></div>';});document.getElementById('s803MatchWidget').innerHTML=html||'<p>No matches</p>';}db.ref(PATH).on('value',function(snap){if(!snap.exists()){document.getElementById('s803MatchWidget').innerHTML='';return;}render(Object.values(snap.val()));});})();<\/script>`;}
async function copyEl(id,btn,lbl){try{await navigator.clipboard.writeText(document.getElementById(id).textContent);btn.classList.add('copied');btn.textContent='✓ Copied!';setTimeout(()=>{btn.classList.remove('copied');btn.textContent=lbl;},2000);}catch(e){}}
function setStatus(msg,type){const el=document.getElementById('statusBar');el.className='status-bar'+(type?' '+type:'');el.innerHTML='<div class="sdot"></div><span>'+msg+'</span>';}
document.querySelectorAll('.out-tab').forEach(tab=>{tab.addEventListener('click',()=>{document.querySelectorAll('.out-tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.out-panel').forEach(p=>p.classList.remove('active'));tab.classList.add('active');document.getElementById('tab-'+tab.dataset.tab).classList.add('active');});});
document.querySelectorAll('.date-tab').forEach(tab=>{tab.addEventListener('click',()=>{document.querySelectorAll('.date-tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');activeOffset=parseInt(tab.dataset.offset);document.getElementById('customDate').value='';});});
document.querySelectorAll('.sport-tab').forEach(tab=>{tab.addEventListener('click',()=>{document.querySelectorAll('.sport-tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');activeSport=tab.dataset.sport;if(allMatches.length)renderEvents();});});
['blogBase','fbUrl','fbMatchPath'].forEach(id=>{const saved=localStorage.getItem('s803_'+id);if(saved)document.getElementById(id).value=saved;document.getElementById(id).addEventListener('input',e=>localStorage.setItem('s803_'+id,e.target.value));});
window.toggleSelect=toggleSelect; window.toggleAll=toggleAll; window.fetchMatches=fetchMatches; window.selectChannel=selectChannel; window.generateCards=generateCards; window.pushToFirebase=pushToFirebase; window.setPushMode=setPushMode; window.copyEl=copyEl; window.deleteMatchFromFirebase=deleteMatchFromFirebase;
initFirebase(); setStatus('Ready. Select date & fetch.','ok');
</script>
